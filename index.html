<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SAP Camera Test</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: auto;
            padding: 25px;
        }

        h1 {
            color: #0a6ed1;
        }

        .capture-button {
            display: block;
            background: #0a6ed1;
            color: white;
            padding: 16px;
            text-align: center;
            border-radius: 6px;
            font-size: 18px;
            cursor: pointer;
            margin: 25px 0;
        }

        #cameraInput {
            display: none;
        }

        #preview {
            display: none;
            width: 100%;
            margin-top: 20px;
            border: 1px solid #ccc;
        }

        #status {
            padding: 12px;
            background: #eef6fc;
            border-radius: 5px;
        }

        #log {
            margin-top: 20px;
            padding: 12px;
            background: #f5f5f5;
            font-family: monospace;
            font-size: 12px;
            white-space: pre-wrap;
        }
    </style>

</head>

<body>

    <h1>SAP Camera Validation</h1>

    <p>
        Camera Capture / Browser Return Test
    </p>

    <p>
        Test Flow:
        Web Page → Camera → Capture → Return → Preview
    </p>


    <label for="cameraInput"
           class="capture-button">
        📷 Capture Image
    </label>


    <input
        id="cameraInput"
        type="file"
        accept="image/*"
        capture="environment">


    <div id="status">
        Ready for camera test
    </div>


    <img
        id="preview"
        alt="Captured Image">


    <div id="log">Test initialized.</div>


    <script>

        const input =
            document.getElementById("cameraInput");

        const preview =
            document.getElementById("preview");

        const status =
            document.getElementById("status");

        const log =
            document.getElementById("log");


        function addLog(message) {

            const time =
                new Date().toLocaleTimeString();

            log.textContent +=
                "\n[" + time + "] " + message;
        }


        input.addEventListener(
            "change",
            function(event) {

                addLog(
                    "Returned from camera"
                );


                const file =
                    event.target.files[0];


                if (!file) {

                    status.textContent =
                        "No image returned.";

                    addLog(
                        "Capture cancelled"
                    );

                    return;
                }


                addLog(
                    "Image received: " +
                    file.name
                );


                const reader =
                    new FileReader();


                reader.onload =
                    function(e) {

                        preview.src =
                            e.target.result;

                        preview.style.display =
                            "block";

                        status.textContent =
                            "SUCCESS: Image returned to webpage.";

                        addLog(
                            "SUCCESS: Image displayed"
                        );

                    };


                reader.onerror =
                    function() {

                        status.textContent =
                            "ERROR: Image could not be loaded.";

                        addLog(
                            "ERROR reading image"
                        );

                    };


                reader.readAsDataURL(file);

            });


        document.addEventListener(
            "visibilitychange",
            function() {

                addLog(
                    "Page visibility: " +
                    document.visibilityState
                );

            });


        window.addEventListener(
            "focus",
            function() {

                addLog(
                    "Browser received focus"
                );

            });

    </script>

</body>

</html>
