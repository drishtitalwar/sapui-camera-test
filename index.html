<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SAPUI5 Camera Test</title>

    <!-- SAPUI5 -->
    <script
        id="sap-ui-bootstrap"
        src="https://ui5.sap.com/resources/sap-ui-core.js"
        data-sap-ui-theme="sap_horizon"
        data-sap-ui-libs="sap.m">
    </script>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 0 auto;
            padding: 25px;
        }

        h1 {
            color: #0a6ed1;
        }

        .capture-button {
            display: block;
            width: 100%;
            padding: 16px;
            box-sizing: border-box;
            background: #0a6ed1;
            color: white;
            text-align: center;
            border-radius: 6px;
            font-size: 18px;
            cursor: pointer;
            margin: 20px 0;
        }

        #cameraInput {
            display: none;
        }

        #preview {
            display: none;
            width: 100%;
            max-height: 450px;
            object-fit: contain;
            margin-top: 20px;
        }

        #status {
            padding: 12px;
            background: #eef6fc;
            margin-top: 15px;
            border-radius: 5px;
        }

        #log {
            background: #f5f5f5;
            padding: 12px;
            margin-top: 20px;
            white-space: pre-wrap;
            font-family: monospace;
            font-size: 12px;
        }
    </style>
</head>

<body>

<h1>SAPUI5 Camera Test</h1>

<p>
    Android Camera Capture / Browser Return Validation
</p>

<p>
    Flow:
    SAPUI5 Web Page → Camera → Capture → Return → Preview
</p>


<label class="capture-button"
       for="cameraInput">
    📷 Capture Image
</label>

<input
    id="cameraInput"
    type="file"
    accept="image/*"
    capture="environment">


<div id="status">
    Ready for camera test
</div>


<img id="preview"
     alt="Captured image preview">


<div id="log">
Test initialized.
</div>


<script>

const input =
    document.getElementById("cameraInput");

const preview =
    document.getElementById("preview");

const status =
    document.getElementById("status");

const log =
    document.getElementById("log");


function writeLog(message) {

    const time =
        new Date().toLocaleTimeString();

    log.textContent +=
        "\n[" + time + "] " + message;
}


input.addEventListener(
    "change",
    function(event) {

        writeLog(
            "Returned from camera/file picker"
        );


        const file =
            event.target.files[0];


        if (!file) {

            status.textContent =
                "Camera cancelled / no image returned.";

            writeLog(
                "No image returned"
            );

            return;
        }


        writeLog(
            "Image received: " +
            file.name
        );


        writeLog(
            "Type: " +
            file.type
        );


        writeLog(
            "Size: " +
            Math.round(file.size / 1024) +
            " KB"
        );


        const reader =
            new FileReader();


        reader.onload =
            function(e) {

                preview.src =
                    e.target.result;

                preview.style.display =
                    "block";

                status.textContent =
                    "SUCCESS: Image returned to webpage.";

                writeLog(
                    "SUCCESS - image displayed after camera return"
                );

            };


        reader.onerror =
            function() {

                status.textContent =
                    "ERROR: Unable to read captured image.";

                writeLog(
                    "ERROR reading image"
                );

            };


        reader.readAsDataURL(
            file
        );

    });


document.addEventListener(
    "visibilitychange",
    function() {

        writeLog(
            "Visibility: " +
            document.visibilityState
        );

    });


window.addEventListener(
    "focus",
    function() {

        writeLog(
            "Browser received focus"
        );

    });

</script>

</body>
</html>
